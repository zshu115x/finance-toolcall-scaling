# Experiment: Do Fine-Tuning and Inference-Time Scaling Compound or Conflict?
# Domain: Financial Q&A tool-calling on FinanceBench
#
# Pipeline:
#   step1 → load FinanceBench + augment with sdg_hub (paraphrase + label)
#   step2 → LoRA fine-tune Qwen2.5-1.5B with training_hub
#   step3 → evaluate base + fine-tuned at N=1,3,5,10 with its_hub
#   step4 → analyze and plot results

# ── Dataset (FinanceBench) ─────────────────────────────────────────────────
dataset:
  # Path to your local FinanceBench copy.
  # Supports: directory with parquet/jsonl files, a single JSONL/CSV/parquet file,
  # or a HuggingFace dataset name (e.g. "PatronusAI/financebench").
  local_path: "data/financebench"
  max_examples: 150     # FinanceBench has 150 questions; load all
  eval_size: 50         # hold out for evaluation; rest goes to train + augmentation
  seed: 42

# ── Data Augmentation (sdg_hub) ───────────────────────────────────────────
generation:
  # LiteLLM model name for augmentation. Examples:
  #   "anthropic/claude-haiku-4-5-20251001"   (ANTHROPIC_API_KEY)
  #   "openai/gpt-4o-mini"                    (OPENAI_API_KEY)
  model: "groq/openai/gpt-oss-120b"
  api_key_env: "GROQ_API_KEY"
  api_base: null 
  # api_base: "https://api.openai.com/v1"                 # null = LiteLLM default for the provider
  paraphrase_multiplier: 4       # paraphrase variants per original question
  max_concurrency: 5
  extra_generation_kwargs:
    reasoning_effort: "high"     # stripped during SDG (causes empty content); used at inference only

# ── Training (training_hub) ────────────────────────────────────────────────
training:
  base_model: "Qwen/Qwen2.5-1.5B-Instruct"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  num_epochs: 3
  learning_rate: 2.0e-4
  micro_batch_size: 1
  max_seq_len: 768       # tool calls are longer than plain answers
  sample_packing: false  # off for small datasets
  bf16: false            # set true on GPU; false for CPU compatibility
  fp16: false
  logging_steps: 5
  save_steps: 100
  output_dir: "models/lora-finance-toolcall"

# ── Inference-Time Scaling (its_hub) ──────────────────────────────────────
# Two modes:
#   local_hf: loads HuggingFace model in-process (no server; works CPU)
#   api:      any OpenAI-compatible endpoint (vLLM, Ollama, OpenAI)
scaling:
  mode: "local_hf"
  api_endpoint: "http://localhost:8000/v1"    # used only when mode=api (vLLM default)
  api_key_env: "OPENAI_API_KEY"               # used only when mode=api
  api_model_name: null                # base variant model name; null → training.base_model
  api_finetuned_model_name: null      # finetuned variant; null → falls back to api_model_name
                                      # set to the --lora-modules name when using vLLM LoRA
  budgets: [1, 3, 5, 10]
  max_tokens: 384               # tool calls need more tokens than plain answers
  temperature: 0.7
  max_concurrency: 1            # local_hf: keep 1; api mode: set to 8-32
  torch_dtype: "float32"        # local_hf only: "float32" (CPU) | "bfloat16" (GPU)

# ── BestOfN Judge (its_hub) ───────────────────────────────────────────────
# OpenAI-compatible model used to score query quality in best_of_n.
# Uses a stronger external model so the judge is independent of the candidate generator.
judge:
  mode: "api"           # "api" = external model below; "local" = reuse candidate LM
  api_endpoint: "https://api.groq.com/openai/v1"
  api_key_env: "GROQ_API_KEY"
  model_name: "openai/gpt-oss-120b"

# ── Paths ──────────────────────────────────────────────────────────────────
paths:
  train_data: "data/train.jsonl"
  eval_data: "data/eval.jsonl"
  results_file: "results/scaling_results.json"
  plots_dir: "results/plots"
